  const bag=$('.ar-bag'), badge=$('.ar-bag-count'), progress=$('.ar-progress-thumb');
  const modal=$('.ar-qv'), qvFront=$('.ar-qv-face.ar-face-front'), qvBack=$('.ar-qv-face.ar-face-back');
  const drawer=$('.ar-drawer'), scrim=$('.ar-scrim'), cartList=$('.ar-cart-list');
  const cartCount=$('.ar-drawer-count'), cartAmount=$('.ar-cart-amount');
  const addBtn=$('.ar-add'), closeQV=$('.ar-qv-close');
  let width=0,height=0,u=1,gs=.455,gap=121,start=113,railTop=148,sag=50;
  let cur=0,target=0,maxScroll=0,velocity=0,lastTime=0;
  let hovered=-1,selectedIndex=-1,selectedSize='S',selectedView='front';
  let modalToken=0,addBusy=false,cartOpen=false,drag=null,suppressClickUntil=0;
  let cart=[{k:3,size:'M',qty:1},{k:4,size:'S',qty:1},{k:1,size:'M',qty:1}];
  // For an EMPTY new store cart, replace the line above with: let cart=[];
  // To enable checkout, supply an actual URL (leave empty if not connected).
  const CHECKOUT_URL='';
  let lastFocus=null;
  const items=[];
  // Test actual pixel decoding, not just whether a URL string exists.
  // Loading the CDN and proxy in parallel prevents a failing proxy from hiding real images.
  function probeImage(url,timeout=11000){
    return new Promise((resolve,reject)=>{
      const img=new Image();let finished=false;
      const end=(ok)=>{if(finished)return;finished=true;clearTimeout(t);img.onload=img.onerror=null;
        if(ok&&img.naturalWidth>=1360&&img.naturalHeight>=2048)resolve(url);
        else reject(new Error('Original sheet unavailable or wrong dimensions: '+url));};
      const t=setTimeout(()=>end(false),timeout);
      img.onload=()=>end(true);img.onerror=()=>end(false);img.src=url;
    });
  }
  function refreshOriginalClothes(){
    if(!items.length)return;
    layout();renderCart();
    const missing=['side','front'].filter(v=>!assetReady[v]);
    if(missing.length===0){
      assetStatus.hidden=true;
      if(!introDone){introDone=true;launchIntro();}
    }else if(Object.values(assetReady).some(Boolean)){
      assetStatus.hidden=false;
      assetMessage.textContent='Original '+missing.join(' + ')+' clothing sheet'+(missing.length>1?'s are':' is')+' unavailable. Upload the matching original PNGs below.';
      assetInputs.hidden=false;
    }
  }
  async function loadOriginalSheet(view){
    try {const url=await probeImage(assetBase+'/'+view+'.png',1800);
      imageURL[view]=url;assetReady[view]=true;refreshOriginalClothes();return true;} catch(e){}
    try {const url=await Promise.any([probeImage(sources[view]),probeImage(proxyURL(sources[view]))]);
      imageURL[view]=url;assetReady[view]=true;refreshOriginalClothes();return true;} catch(e){}
    assetReady[view]=false;
    if(view!=='back'||(!assetReady.side||!assetReady.front)){
      assetStatus.hidden=false;
      assetMessage.textContent='Original clothing images could not load from the supplied links. To show the SAME clothes, select the three original PNG sheets below (or place them in assets/).';
      assetInputs.hidden=false;
    }
    return false;
  }
  const sheets={};
  for(const view of Object.keys(sources))sheets[view]=loadOriginalSheet(view);
  assetInputs.querySelectorAll('input[data-original-view]').forEach(input=>input.addEventListener('change',async()=>{
    const file=input.files&&input.files[0];if(!file)return;
    const view=input.dataset.originalView,url=URL.createObjectURL(file);
    try{
      await probeImage(url,3000);
      imageURL[view]=url;assetReady[view]=true;
      refreshOriginalClothes();
      if(view==='back'&&selectedIndex>=0)sizeQuickView();
    }catch(e){URL.revokeObjectURL(url);assetMessage.textContent='Please use the original '+view+' sheet: 1360 × 2048 PNG/WebP.';}
  }));

  function setCrop(el,view,k,scale){
    const [y,h,hookX]=crops[view][k];
    el.style.width=(340*scale)+'px';
    el.style.height=((h+6)*scale)+'px';
    el.style.backgroundImage=imageURL[view]?'url("'+imageURL[view]+'")':'none';
    el.style.backgroundSize=(1360*scale)+'px auto';
    el.style.backgroundPosition=(-(hookX-170)*scale)+'px '+(-y*scale)+'px';
    el.style.backgroundRepeat='no-repeat';
    el.dataset.view=view;el.dataset.k=String(k);
  }
  function makePiece(k,i){
    const element=document.createElement('div');element.className='ar-piece';element.style.zIndex=String(1+i%4);
    const drop=document.createElement('div');drop.className='ar-drop';
    const sway=document.createElement('div');sway.className='ar-sway';
    const lift=document.createElement('div');lift.className='ar-lift';
    const side=document.createElement('div');side.className='ar-face ar-face-side';
    const front=document.createElement('div');front.className='ar-face ar-face-front';
    const tag=document.createElement('span');tag.className='ar-tag';tag.textContent='$690';
    tag.style.transform='rotate('+tagAngles[i%tagAngles.length]+'deg)';
    lift.append(side,front,tag);sway.appendChild(lift);drop.appendChild(sway);
    const shadow=document.createElement('div');shadow.className='ar-shadow';
    const hit=document.createElement('button');hit.className='ar-hit';hit.type='button';
    hit.setAttribute('aria-label',names[k]+', '+money(price));
    hit.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!drag&&!addBusy)hover(i)});
    hit.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!drag)unhover(i)});
    hit.addEventListener('focus',()=>hover(i));
    hit.addEventListener('blur',()=>unhover(i));
    hit.addEventListener('click',()=>{
      if(performance.now()<suppressClickUntil||addBusy||cartOpen||selectedIndex>=0)return;
      if(matchMedia('(hover: none)').matches && hovered!==i){hover(i);return}
      openQuickView(i);
    });
    element.append(shadow,drop,hit);garments.appendChild(element);
    return {k,i,element,drop,sway,lift,side,front,tag,shadow,hit,angle:0,av:0,offset:0,impulse:0};
  }
  for(let i=0;i<order.length;i++)items.push(makePiece(order[i],i));

  function railY(x){
    const t=Math.max(-1,Math.min(1,(x-width/2)/(width/2||1)));
    return (railTop+sag*(1-t*t))*u;
  }
  function layout(){
    width=zone.clientWidth;height=root.clientHeight;
    if(!width||!height)return;
    const mobile=width<=820;
    u=mobile?Math.min(width/390,height/670):Math.min(width/1440,height/780);
    u=Math.max(.35,u);
    root.style.setProperty('--ar-u',u+'px');
    gs=mobile?.30:.455;gap=mobile?80:121;start=mobile?46:113;
    railTop=mobile?158:148;sag=mobile?26:50;
    rail.setAttribute('viewBox',`0 0 ${width} ${zone.clientHeight}`);
    const y0=railY(0), ym=railY(width/2), controlY=2*ym-y0;
    const d=`M 0 ${y0} Q ${width/2} ${controlY} ${width} ${y0}`;
    for(const path of $$('.ar-rail-svg path')){
      const shift=path.classList.contains('ar-rail-shadow')?4*u:path.classList.contains('ar-rail-shine')?-1.3*u:0;
      path.setAttribute('d',`M 0 ${y0+shift} Q ${width/2} ${controlY+shift} ${width} ${y0+shift}`);
      path.setAttribute('stroke-width',(path.classList.contains('ar-rail-shadow')?3:path.classList.contains('ar-rail-shine')?1.1:5.2)*u);
    }
    maxScroll=Math.max(0,(2*start+(order.length-1)*gap)*u-width);
    cur=Math.min(cur,maxScroll);target=Math.min(target,maxScroll);
    for(const item of items){
      setCrop(item.side,'side',item.k,gs*u);setCrop(item.front,'front',item.k,gs*u);
      const h=crops.side[item.k][1]*gs*u;
      item.shadow.style.width=(110*(gs/.48)*u)+'px';item.shadow.style.top=(h+4*u)+'px';
      item.hit.style.width=(gap*u)+'px';item.hit.style.height=(h+24*u)+'px';item.hit.style.left=(-gap*u/2)+'px';
    }
    if(selectedIndex>=0)sizeQuickView();
    tickPositions(1);
  }
  function hover(i){
    if(selectedIndex>=0||cartOpen||drag?.active)return;
    if(hovered===i)return;
    if(hovered>=0)items[hovered].element.classList.remove('is-hovered');
    hovered=i;items[i].element.classList.add('is-hovered');
    hint.innerHTML='<span class="ar-hint-name"></span><span class="ar-hint-price">'+money(price)+'</span>';
    hint.querySelector('.ar-hint-name').textContent=names[items[i].k];
  }
  function unhover(i){
    if(hovered!==i)return;
    items[i].element.classList.remove('is-hovered');hovered=-1;
    hint.textContent=matchMedia('(hover: none)').matches?'Tap a piece · tap again to look closer':'Hover a piece · click to look closer';
  }
  function tickPositions(dt){
    const offsetScale=gs/.48*u;
    for(const item of items){
      let space=0;
      if(hovered>=0&&hovered!==item.i){
        const distance=item.i-hovered;
        space=Math.sign(distance)*[0,50,24,9,0][Math.min(4,Math.abs(distance))]*offsetScale;
      }
      item.offset+=(space-item.offset)*(reduced.matches?1:1-Math.pow(.84,dt));
      const x=(start+item.i*gap)*u-cur+item.offset;
      item.element.style.transform=`translate3d(${x}px,${railY(x)-3*u}px,0)`;
      if(!reduced.matches){
        const angleTarget=Math.max(-7,Math.min(7,-velocity*.22));
        item.av+=(angleTarget-item.angle)*.05*dt;
        item.av*=Math.pow(.88,dt);item.angle+=item.av*dt;
        item.sway.style.transform=`rotate(${item.angle}deg)`;
      }else item.sway.style.transform='none';
    }
    progress.style.left=((maxScroll?cur/maxScroll:0)*42)+'%';
  }
  function frame(now){
    const dt=Math.min(3,(now-(lastTime||now))/16.667||1);lastTime=now;
    const before=cur;
    cur+=(target-cur)*(1-Math.pow(1-.085,dt));
    if(Math.abs(cur-target)<.08)cur=target;
    velocity=(cur-before)/dt;
    if(width)tickPositions(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function launchIntro(){
    if(reduced.matches)return;
    items.forEach((item,i)=>{
      item.drop.animate([
        {transform:`translateY(${-42*u}px)`,opacity:0,filter:'blur(6px)'},
        {transform:'translateY(0)',opacity:1,filter:'blur(0px)'}
      ],{duration:620,delay:i*70,easing:'cubic-bezier(.2,.9,.3,1)',fill:'backwards'});
      setTimeout(()=>{item.av+=(i%2?1:-1)*1.6},i*70+420);
    });
    $('.ar-heading').animate([{opacity:0,transform:'translateY(6px)',filter:'blur(10px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],
      {duration:780,easing:'cubic-bezier(.25,.8,.3,1)'});
    $('.ar-footer').animate([{opacity:0},{opacity:1}],{duration:450,delay:580,fill:'backwards'});
  }
  // Never announce images as ready on a timer. The original images MUST decode.
  Promise.all([sheets.side,sheets.front]).then(()=>refreshOriginalClothes());
  window.addEventListener('resize',layout);
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(layout).observe(root);
  layout();
  hint.textContent=matchMedia('(hover: none)').matches?'Tap a piece · tap again to look closer':hint.textContent;

  zone.addEventListener('wheel',e=>{
    if(selectedIndex>=0||cartOpen)return;
    const dominant=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if(!dominant||!maxScroll)return;
    const next=Math.max(0,Math.min(maxScroll,target+dominant*.9));
    // At the ends, regular website vertical scrolling remains available.
    if(next===target&&!e.shiftKey&&Math.abs(e.deltaX)<Math.abs(e.deltaY))return;
    e.preventDefault();target=next;
  },{passive:false});
  zone.addEventListener('pointerdown',e=>{
    if(selectedIndex>=0||cartOpen||e.button>0)return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,startTarget:target,lastX:e.clientX,lastTime:performance.now(),speed:0,active:false};
  });
  window.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==e.pointerId)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.active&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){
      drag.active=true;zone.classList.add('is-grabbing');if(hovered>=0)unhover(hovered);
    }
    if(!drag.active)return;
    const now=performance.now(),elapsed=Math.max(1,now-drag.lastTime);
    drag.speed=(e.clientX-drag.lastX)/elapsed;
    drag.lastX=e.clientX;drag.lastTime=now;
    target=Math.max(0,Math.min(maxScroll,drag.startTarget-dx*1.15));
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  function endDrag(e){
    if(!drag||drag.id!==e.pointerId)return;
    if(drag.active){
      target=Math.max(0,Math.min(maxScroll,target-drag.speed*260));
      suppressClickUntil=performance.now()+250;
      zone.classList.remove('is-grabbing');
    }
    drag=null;
  }
  window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
  zone.addEventListener('pointerleave',()=>{if(!drag&&hovered>=0)unhover(hovered)});

  function sizeQuickView(){
    if(selectedIndex<0)return;
    const k=items[selectedIndex].k;
    const art=$('.ar-qv-imagebox');
    const isMobile=window.innerWidth<=820;
    const bounds=art.getBoundingClientRect();
    const maxH=Math.max(crops.front[k][1],crops.back[k][1])+6;
    const scale=Math.min(isMobile?.46:.9,
      (Math.max(150,bounds.height-(isMobile?50:80)))/maxH,
      (Math.max(150,bounds.width-20))/340);
    setCrop(qvFront,'front',k,scale);setCrop(qvBack,'back',k,scale);
  }
  function chooseView(view){
    selectedView=view;
    qvFront.classList.toggle('is-hidden',view!=='front');
    qvBack.classList.toggle('is-hidden',view!=='back');
    $$('.ar-tab').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.view===view)));
  }
  function openQuickView(i){
    if(selectedIndex>=0||addBusy)return;
    lastFocus=document.activeElement;modalToken++;selectedIndex=i;selectedSize='S';
    const k=items[i].k;
    $('.ar-qv-counter').textContent=(i+1)+' / '+order.length;
    $('.ar-qv-title').textContent=names[k];
    $('.ar-qv-meta-name').textContent=names[k];
    $$('.ar-size').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.size==='S')));
    chooseView('front');
    modal.hidden=false;root.classList.add('ar-qv-open');sizeQuickView();
    closeQV.focus();
    if(!reduced.matches){
      const origin=items[i].element.getBoundingClientRect(),art=$('.ar-qv-imagebox').getBoundingClientRect();
      const dx=(origin.left-art.left)*.38,dy=(origin.top-art.top)*.25;
      $('.ar-qv-imagebox').animate([
        {transform:`translate(${dx}px,${dy}px) scale(.83)`,opacity:.4},
        {transform:'translate(0,0) scale(1)',opacity:1}
      ],{duration:700,easing:'cubic-bezier(.22,1,.36,1)'});
      $('.ar-qv-info').animate([{transform:'translateY(10px)',opacity:0},{transform:'translateY(0)',opacity:1}],
        {duration:600,delay:240,easing:'ease-out',fill:'backwards'});
    }
  }
  function closeQuickView(fast=false){
    if(selectedIndex<0)return;
    const token=++modalToken;
    const old=selectedIndex;
    selectedIndex=-1;root.classList.remove('ar-qv-open');
    const finish=()=>{if(token!==modalToken)return;modal.hidden=true;items[old].element.style.visibility='';if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true})};
    if(fast||reduced.matches)finish();
    else{
      const anim=$('.ar-qv-imagebox').animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.82)'}],
        {duration:340,easing:'cubic-bezier(.55,0,.2,1)'});
      anim.finished.then(finish).catch(finish);
    }
  }
  closeQV.addEventListener('click',()=>closeQuickView());
  $$('.ar-tab').forEach(el=>el.addEventListener('click',async()=>{
    const view=el.dataset.view;
    if(view==='back')await sheets.back;
    if(view==='back'&&!assetReady.back){
      assetStatus.hidden=false;assetInputs.hidden=false;
      assetMessage.textContent='Back-view original image is not available. Upload the original back.png sheet.';
      return;
    }
    if(selectedIndex>=0)chooseView(view);
  }));
  $$('.ar-size').forEach(el=>el.addEventListener('click',()=>{
    selectedSize=el.dataset.size;
    $$('.ar-size').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
  }));

  function createFlyClone(face){
    const rect=face.getBoundingClientRect();
    const clone=face.cloneNode(false);clone.className='ar-face ar-fly';
    clone.style.top=rect.top+'px';clone.style.left=rect.left+'px';
    clone.style.width=rect.width+'px';clone.style.height=rect.height+'px';
    clone.style.transform='none';clone.style.opacity='1';clone.style.visibility='visible';clone.style.transition='none';
    document.body.appendChild(clone);return {clone,rect};
  }
  function animateIntoBag(face){
    const {clone,rect}=createFlyClone(face),b=bag.getBoundingClientRect();
    const deltaX=b.left+b.width/2-(rect.left+rect.width/2);
    const deltaY=b.top+b.height/2-(rect.top+rect.height/2);
    const end=Math.max(.04,b.height*1.6/Math.max(1,rect.height));
    const animations=[
      {transform:'translate(0px,0px) scale(1)',opacity:1},
      {transform:`translate(${deltaX*.45}px,${deltaY*.45-90*u}px) scale(${(1+end)*.42})`,opacity:.9,offset:.45},
      {transform:`translate(${deltaX}px,${deltaY}px) scale(${end})`,opacity:.35}
    ];
    if(reduced.matches){clone.remove();return Promise.resolve()}
    const anim=clone.animate(animations,{duration:820,easing:'cubic-bezier(.55,.05,.35,1)',fill:'forwards'});
    return anim.finished.catch(()=>{}).then(()=>clone.remove());
  }
  addBtn.addEventListener('click',async()=>{
    if(selectedIndex<0||addBusy)return;
    addBusy=true;
    const i=selectedIndex,k=items[i].k,size=selectedSize;
    addBtn.classList.add('is-loading');
    addBtn.innerHTML='<span class="ar-spinner" aria-hidden="true"></span>Adding…';
    if(!reduced.matches)await new Promise(r=>setTimeout(r,1000));
    const face=selectedView==='back'?qvBack:qvFront;
    const fly=animateIntoBag(face);
    closeQuickView(true);
    if(!reduced.matches){
      items[i].drop.animate([{transform:`translateY(${-24*u}px)`,opacity:0},{transform:'translateY(0)',opacity:1}],
        {duration:520,delay:260,easing:'ease-out'});
      items[i].av+=1.4;
    }
    await fly;
    cart.unshift({k,size,qty:1});renderCart();
    if(!reduced.matches){
      badge.animate([{transform:'scale(1)'},{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:500,easing:'cubic-bezier(.3,1.6,.5,1)'});
      bag.animate([{transform:'scale(1)'},{transform:'scale(1.22) rotate(-6deg)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:520,easing:'ease-out'});
    }
    addBtn.textContent='Add to cart';addBtn.classList.remove('is-loading');addBusy=false;
  });

  function renderCart(){
    const totalQty=cart.reduce((sum,item)=>sum+item.qty,0);
    badge.textContent=String(totalQty);cartCount.textContent=String(totalQty);
    cartAmount.textContent=money(cart.reduce((sum,item)=>sum+price*item.qty,0));
    cartList.replaceChildren();
    if(!cart.length){const p=document.createElement('p');p.className='ar-cart-empty';p.textContent='Your cart is empty.';cartList.appendChild(p)}
    for(let index=0;index<cart.length;index++){
      const item=cart[index],el=document.createElement('div');el.className='ar-cart-row';
      const thumb=document.createElement('div');thumb.className='ar-cart-thumb';
      const crop=document.createElement('div');crop.className='ar-cart-thumb-face';
      const scale=Math.min(70/340,88/(crops.front[item.k][1]+6));setCrop(crop,'front',item.k,scale);thumb.append(crop);
      const center=document.createElement('div');
      const name=document.createElement('div');name.className='ar-cart-name';name.textContent=names[item.k];
      const detail=document.createElement('div');detail.className='ar-cart-detail';detail.textContent='Size: '+item.size+' · '+money(price);
      const qty=document.createElement('div');qty.className='ar-quantity';
      for(const [label,delta] of [['−',-1],['+',1]]){
        if(delta===1){const span=document.createElement('span');span.textContent=String(item.qty);qty.appendChild(span)}
        const b=document.createElement('button');b.type='button';b.textContent=label;
        b.setAttribute('aria-label',(delta===1?'Increase':'Decrease')+' quantity of '+names[item.k]);
        b.addEventListener('click',()=>{item.qty+=delta;if(item.qty<=0)cart.splice(index,1);renderCart()});
        if(delta===-1)qty.prepend(b);else qty.append(b);
      }
      const remove=document.createElement('button');remove.className='ar-remove';remove.type='button';remove.textContent='Remove';
      remove.setAttribute('aria-label','Remove '+names[item.k]);remove.addEventListener('click',()=>{cart.splice(index,1);renderCart()});
      center.append(name,detail,qty,remove);
      const line=document.createElement('div');line.className='ar-cart-total-line';line.textContent=money(price*item.qty);
      el.append(thumb,center,line);cartList.append(el);
    }
    $('.ar-checkout').disabled=!CHECKOUT_URL||!cart.length;
  }
  function openCart(){
    if(selectedIndex>=0)closeQuickView(true);
    lastFocus=document.activeElement;
    cartOpen=true;drawer.setAttribute('aria-hidden','false');root.classList.add('ar-cart-open');
    scrim.hidden=false;requestAnimationFrame(()=>scrim.classList.add('is-visible'));
    bag.setAttribute('aria-expanded','true');$('.ar-drawer-close').focus();
  }
  function closeCart(){
    if(!cartOpen)return;cartOpen=false;drawer.setAttribute('aria-hidden','true');root.classList.remove('ar-cart-open');
    bag.setAttribute('aria-expanded','false');scrim.classList.remove('is-visible');
    setTimeout(()=>{if(!cartOpen)scrim.hidden=true},300);
    bag.focus({preventScroll:true});
  }
  bag.addEventListener('click',()=>cartOpen?closeCart():openCart());
  $('.ar-drawer-close').addEventListener('click',closeCart);
  scrim.addEventListener('click',closeCart);
  $('.ar-checkout').addEventListener('click',()=>{if(CHECKOUT_URL&&cart.length)location.href=CHECKOUT_URL});
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(selectedIndex>=0){e.preventDefault();closeQuickView()}
      else if(cartOpen){e.preventDefault();closeCart()}
    }
    if(selectedIndex<0&&!cartOpen&&root.contains(document.activeElement)&&['ArrowLeft','ArrowRight'].includes(e.key)){
      e.preventDefault();target=Math.max(0,Math.min(maxScroll,target+(e.key==='ArrowRight'?1:-1)*gap*u));
    }
    if((selectedIndex>=0||cartOpen)&&e.key==='Tab'){
      const dialog=selectedIndex>=0?modal:drawer;
      const focusables=Array.from(dialog.querySelectorAll('button:not([disabled])'));
      if(!focusables.length)return;
      const first=focusables[0],last=focusables[focusables.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });
  renderCart();
})();
</script>
</body></html>
